# Everything the KB needs, for local development and small deployments.
#
#   cp .env.example .env   # then set KB_EMBEDDING_API_KEY
#   docker compose up -d
#   docker compose exec kb bun scripts/create-api-key.ts my-tenant
services:
  kb:
    build: .
    image: ghcr.io/rantai-dev/rantai-kb:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://kb:kb@postgres:5432/rantai_kb?schema=public
      SURREAL_DB_URL: ws://surrealdb:8000/rpc
      SURREAL_DB_USER: root
      SURREAL_DB_PASS: root
      SURREAL_DB_NAMESPACE: rantai
      SURREAL_DB_DATABASE: knowledge
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: kbadmin
      S3_SECRET_ACCESS_KEY: kbsecret123
      S3_BUCKET: rantai-kb
      S3_ENABLE_PATH_STYLE: "1"
      KB_EMBEDDING_BASE_URL: ${KB_EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1/embeddings}
      KB_EMBEDDING_API_KEY: ${KB_EMBEDDING_API_KEY:-}
      KB_EMBEDDING_MODEL: ${KB_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      KB_EMBEDDING_DIM: ${KB_EMBEDDING_DIM:-4096}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      surrealdb: { condition: service_started }
      minio: { condition: service_healthy }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: rantai_kb
    volumes:
      - kb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      timeout: 5s
      retries: 10

  surrealdb:
    # Pinned to v2: the JS client rejects the 3.x handshake.
    image: surrealdb/surrealdb:v2
    command: start --user root --pass root rocksdb:/data/kb.db
    volumes:
      - kb-surreal:/data
    user: root

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kbadmin
      MINIO_ROOT_PASSWORD: kbsecret123
    volumes:
      - kb-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbucket:
    image: quay.io/minio/minio
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 kbadmin kbsecret123 &&
             mc mb --ignore-existing local/rantai-kb &&
             echo bucket ready"

volumes:
  kb-postgres:
  kb-surreal:
  kb-minio:
