<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64"
     role="img" aria-label="RantAI KB — document ingest and retrieval as a service">
  <title>RantAI KB</title>
  <desc>A stack of document lines with one chunk lifted out and bound to a chain
        link — retrieval as a join, not a search.</desc>

  <!-- The corpus. Lines of prose sitting in storage. -->
  <g fill="currentColor" opacity=".28">
    <rect x="6"  y="14" width="34" height="5" rx="2.5"/>
    <rect x="6"  y="24" width="34" height="5" rx="2.5"/>
    <rect x="6"  y="44" width="34" height="5" rx="2.5"/>
    <rect x="6"  y="54" width="22" height="5" rx="2.5"/>
  </g>

  <!-- The retrieved chunk. The one row that came back, at full weight. -->
  <rect x="6" y="34" width="34" height="5" rx="2.5" fill="#2E7DE4"/>

  <!-- Rantai — the chain. Two interlocking links: the chunk is bound to its
       source, so a hit carries its provenance instead of being re-derived. -->
  <g fill="none" stroke="#2E7DE4" stroke-width="4.5">
    <rect x="48" y="27.5" width="19" height="17" rx="8.5"/>
    <rect x="62" y="27.5" width="19" height="17" rx="8.5" stroke="currentColor" opacity=".45"/>
  </g>

  <!-- Wordmark -->
  <text x="95" y="42" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="27" font-weight="680" letter-spacing="-.6" fill="currentColor">RantAI<tspan fill="#2E7DE4"> KB</tspan></text>
</svg>
