[package]
name = "kb-store-surreal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The RetrievalIndex contract suite against a live SurrealDB. Off by default so
# `cargo test --workspace` needs no containers; the test also skips itself unless
# KB_SURREAL_CONTRACT=1, so turning the feature on without a running stack does
# not produce a confusing failure.
integration = ["kb-ports/contract"]

[dependencies]
kb-ports = { path = "../kb-ports" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }