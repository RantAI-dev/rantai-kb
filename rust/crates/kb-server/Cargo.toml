[package]
name = "kb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kb-ports = { path = "../kb-ports" }
kb-core = { path = "../kb-core" }
kb-inference = { path = "../kb-inference" }
kb-store-pg = { path = "../kb-store-pg" }
kb-store-tables = { path = "../kb-store-tables" }
kb-store-qdrant = { path = "../kb-store-qdrant" }
kb-store-blob = { path = "../kb-store-blob" }
kb-extract = { path = "../kb-extract" }
kb-cache = { path = "../kb-cache" }
kb-engine = { path = "../kb-engine" }
kb-eval = { path = "../kb-eval" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
# The OpenAPI 3.1 document of the HTTP API and the Swagger UI that renders it.
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
# `kb-server setup --check` probes model endpoints and stores directly.
reqwest = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
qdrant-client = { version = "1.19.0", default-features = false, features = [
    "serde",
    "generate-snippets",
] }

[dev-dependencies]
kb-ports = { path = "../kb-ports" }
kb-engine = { path = "../kb-engine", features = ["test-utils"] }
kb-eval = { path = "../kb-eval" }
# The leak matrix drives kb-eval as a black-box HTTP client, so its test needs
# the same client library kb-eval uses.
reqwest = { workspace = true }
tokio = { workspace = true }
