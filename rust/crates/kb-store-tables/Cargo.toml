[package]
name = "kb-store-tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The TableStore contract suite against a live Postgres + blob store. Off by
# default so `cargo test --workspace` needs no database; the tests also refuse
# to report a pass unless KB_TABLES_CONTRACT=1, so turning the feature on
# without a running stack cannot look like coverage.
integration = ["kb-ports/contract"]

[dependencies]
kb-core = { path = "../kb-core" }
kb-ports = { path = "../kb-ports" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
# DuckDB, bundled: it compiles DuckDB from source, which is slow but means the
# adapter has one query engine with no system dependency. Parquet is written by
# DuckDB itself (`COPY … TO … (FORMAT PARQUET)`), so no arrow/parquet crate is
# linked for the write path; the crate's own arrow dependency is unavoidable.
duckdb = { version = "1.20000.2", features = ["bundled", "parquet"] }

[dev-dependencies]
tokio = { workspace = true }
