[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.16"
async-trait = "0.1.89"
tokio = { version = "1.43.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "test-util"] }
futures = "0.3.31"
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8.5", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
axum = { version = "0.7.9", features = ["macros"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace"] }
sha2 = "0.10.9"
hex = "0.4.3"
hmac = "0.12.1"
chrono = "0.4.41"
fancy-regex = "0.14.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41.0" }
calamine = { version = "0.36.1" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.97"
pdfium-render = { version = "0.9.4", features = ["thread_safe", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Clippy: `all` + `pedantic` as warnings. `pedantic` is noisy; the plan budget
# acknowledges that some pedantic warnings will remain. Denied lints must reach
# zero — they are the ones that signal a real bug.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Explicitly denied: silent misbehaviour hazards.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Explicitly allowed: style opinions that fight idiomatic library code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
doc_markdown = "warn"
