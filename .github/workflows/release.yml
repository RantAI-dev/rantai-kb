name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version and image name
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR rejects uppercase, and the org is spelled RantAI-dev.
          echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          push: true
          # arm64 matters here: the on-prem GPU boxes this runs on are aarch64.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            KB_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  images:
    name: Publish the OCR sidecar image (${{ matrix.sidecar }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU sidecar (PP-OCRv6 through ONNX Runtime) is pure python: it
          # builds for both architectures.
          - sidecar: ocr-cpu
            dirs: ocr-cpu
            platforms: linux/amd64,linux/arm64
          # The layout sidecar runs a CUDA model, and the CUDA wheels are
          # amd64 only.
          - sidecar: ocr-layout
            dirs: ocr-layout
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version and image name
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - id: sidecar
        name: Find the sidecar build context
        run: |
          DIR=""
          for candidate in ${{ matrix.dirs }}; do
            if [ -d "rust/deploy/$candidate" ]; then
              DIR="rust/deploy/$candidate"
              break
            fi
          done
          if [ -z "$DIR" ]; then
            echo "no build context for the ${{ matrix.sidecar }} sidecar (looked in rust/deploy/${{ matrix.dirs }})" >&2
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.sidecar.outputs.dir }}
          file: ${{ steps.sidecar.outputs.dir }}/Dockerfile
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ steps.meta.outputs.image }}-${{ matrix.sidecar }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-${{ matrix.sidecar }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Package the release bundle
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        # The bundle is what install.sh downloads: the binary, libpdfium and the
        # compose stack, with the version written into VERSION.
        run: rust/scripts/package-release.sh "${{ matrix.target }}" "$VERSION" "$PWD/dist"

      - name: Drop the unpacked bundle
        # Only the tarball and its checksum are uploaded; the unpacked copy is
        # a local convenience.
        run: rm -rf dist/rantai-kb-*/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [image, images, binaries]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*

      - name: Collect the tarballs and the checksums
        run: |
          cp dist/*/*.tar.gz .
          cat dist/*/SHA256SUMS | sort -k2 > SHA256SUMS
          rm -rf dist
          cat SHA256SUMS
          # The installer itself is a release asset: the one-liner points at
          # the tag, not at a file that may move.
          cp install.sh .

      - name: Release notes
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "notes<<EOF"
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --pretty=format:'- %s' "$PREV..$TAG"
            else
              echo "First release of the RantAI KB service."
            fi
            echo
            echo
            echo "## Install"
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/RantAI-dev/rantai-kb/$TAG/install.sh | sh"
            echo '```'
            echo
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${{ needs.image.outputs.image }}:${{ needs.image.outputs.version }}"
            echo '```'
            echo
            echo "## Binaries"
            echo
            # Single quotes: backticks inside double quotes are command substitution.
            echo 'The release assets are the tarballs (`rantai-kb-<version>-<target>.tar.gz`),'
            echo 'one per target, with the checksums in SHA256SUMS. `install.sh` picks the'
            echo 'right one for the machine.'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
          files: |
            *.tar.gz
            SHA256SUMS
            install.sh
