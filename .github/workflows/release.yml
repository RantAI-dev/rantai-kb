name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - id: meta
        name: Resolve version and image name
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # GHCR rejects uppercase, and the org is spelled RantAI-dev.
          echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

  image:
    name: Image (linux/${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # One native runner per architecture. Emulating arm64 with QEMU on an
          # x86 runner took 5.4 h for this build (cargo chef cook alone), which
          # is longer than a job may live; a native arm64 runner does it in
          # about the same time as amd64.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed by digest; the merge job below turns the
      # digests into the multi-arch tags. Cache scopes match CI's, so a green
      # PR leaves the release build warm.
      - id: build
        name: Build and push linux/${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            KB_VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          outputs: >-
            type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest" || { echo "the build produced no digest" >&2; exit 1; }
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: Publish the multi-arch image
    needs: [meta, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-linux-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd "${{ runner.temp }}/digests"
          args=()
          for f in *; do
            args+=("$IMAGE@sha256:$f")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no per-architecture digests were downloaded" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  images:
    name: Publish the OCR sidecar image (${{ matrix.sidecar }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU sidecar (PP-OCRv6 through ONNX Runtime) is pure python: it
          # builds for both architectures.
          - sidecar: ocr-cpu
            dirs: ocr-cpu
            platforms: linux/amd64,linux/arm64
          # The layout sidecar runs a CUDA model, and the CUDA wheels are
          # amd64 only.
          - sidecar: ocr-layout
            dirs: ocr-layout
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version and image name
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - id: sidecar
        name: Find the sidecar build context
        run: |
          DIR=""
          for candidate in ${{ matrix.dirs }}; do
            if [ -d "rust/deploy/$candidate" ]; then
              DIR="rust/deploy/$candidate"
              break
            fi
          done
          if [ -z "$DIR" ]; then
            echo "no build context for the ${{ matrix.sidecar }} sidecar (looked in rust/deploy/${{ matrix.dirs }})" >&2
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.sidecar.outputs.dir }}
          file: ${{ steps.sidecar.outputs.dir }}/Dockerfile
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ steps.meta.outputs.image }}-${{ matrix.sidecar }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-${{ matrix.sidecar }}:latest
          cache-from: type=gha,scope=sidecar-${{ matrix.sidecar }}
          cache-to: type=gha,mode=max,scope=sidecar-${{ matrix.sidecar }}

  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # macos-14's arm64 image is not enabled for this repository
          # ("configuration 'macos-14-arm64-us-default' is not supported");
          # macos-15 is the same arm64 runner under a label that is.
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Package the release bundle
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        # The bundle is what install.sh downloads: the binary, libpdfium and the
        # compose stack, with the version written into VERSION.
        run: rust/scripts/package-release.sh "${{ matrix.target }}" "$VERSION" "$PWD/dist"

      - name: Drop the unpacked bundle
        # Only the tarball and its checksum are uploaded; the unpacked copy is
        # a local convenience.
        run: rm -rf dist/rantai-kb-*/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [meta, image-merge, images, binaries]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*

      - name: Collect the tarballs and the checksums
        run: |
          cp dist/*/*.tar.gz .
          cat dist/*/SHA256SUMS | sort -k2 > SHA256SUMS
          rm -rf dist
          cat SHA256SUMS
          # One checksum line per tarball: a mismatch means an artifact went
          # missing before the release was written.
          tarballs=$(ls -1 ./*.tar.gz | wc -l)
          sums=$(grep -c '  rantai-kb-' SHA256SUMS)
          if [ "$tarballs" -ne "$sums" ]; then
            echo "$tarballs tarballs but $sums checksum lines" >&2
            exit 1
          fi
          # install.sh is already at the workspace root (the checkout), and the
          # release's `files:` picks it up from there — copying it onto itself
          # failed on the first run that got this far.
          test -f install.sh

      - name: Release notes
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "notes<<EOF"
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --pretty=format:'- %s' "$PREV..$TAG"
            else
              echo "First release of the RantAI KB service."
            fi
            echo
            echo
            echo "## Install"
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/RantAI-dev/rantai-kb/$TAG/install.sh | sh"
            echo '```'
            echo
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}"
            echo '```'
            echo
            echo "## Binaries"
            echo
            # Single quotes: backticks inside double quotes are command substitution.
            echo 'The release assets are the tarballs (`rantai-kb-<version>-<target>.tar.gz`),'
            echo 'one per target, with the checksums in SHA256SUMS. `install.sh` picks the'
            echo 'right one for the machine.'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
          files: |
            *.tar.gz
            SHA256SUMS
            install.sh

  verify-install:
    name: Install the release (${{ matrix.os }})
    needs: [meta, release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-15
    steps:
      # A release is only finished when the one-liner in its notes installs it:
      # this downloads the published assets, verifies the checksum and runs the
      # installed binary, on each platform we ship.
      - name: Install with the published one-liner
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/RantAI-dev/rantai-kb/$TAG/install.sh" |
            sh -s -- --version "$VERSION"

      - name: The installed CLI runs
        run: |
          "$HOME/.local/bin/rantai-kb" --version
          "$HOME/.local/bin/rantai-kb" --help | sed -n '1,12p'
          ls "$HOME/.rantai-kb/lib" "$HOME/.rantai-kb/deploy" | sed -n '1,20p'
