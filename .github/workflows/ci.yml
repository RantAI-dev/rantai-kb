name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust formatting, clippy, and boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --manifest-path rust/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: KB boundary check
        run: cargo run --manifest-path rust/Cargo.toml -p kb-server -- check-boundary
      # The engine must never construct an adapter directly. This is the
      # invariant that keeps the KB embeddable as well as standalone — if it
      # breaks, the next extraction becomes a rewrite.
      - name: Scope token isolation check
        run: |
          if git grep -n "new_for_adapter" rust/crates/ \
            ':!rust/crates/kb-ports' \
            ':!rust/crates/kb-store-pg' \
            ':!rust/crates/kb-engine/src/fakes.rs'; then
            echo "ERROR: new_for_adapter called outside adapter/fakes!"
            exit 1
          fi

  rust-test:
    name: Rust test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch libpdfium
        run: |
          ./rust/scripts/fetch-pdfium.sh ./rust/.vendor/pdfium
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/rust/.vendor/pdfium/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Run workspace tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

  pg-contracts:
    name: Postgres contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each contract gets its own database. The outbox contract's claim query is
    # tenant-agnostic, so leftover ScopeOutbox rows from another contract would be
    # claimed and break its "exactly one row" assertion. Versions, outbox and ACL
    # migrate their own database from prisma/migrations; graph_contract only
    # connects, so its database is migrated by the step below. The scope-limit
    # contract also migrates itself (SEC-2d) and only needs its own database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KB_PG_VERSIONS_CONTRACT: "1"
      KB_PG_VERSIONS_URL: postgres://postgres:pw@localhost:5432/kb_versions
      KB_PG_OUTBOX_CONTRACT: "1"
      KB_PG_OUTBOX_URL: postgres://postgres:pw@localhost:5432/kb_outbox
      KB_PG_ACL_CONTRACT: "1"
      KB_PG_ACL_URL: postgres://postgres:pw@localhost:5432/kb_acl
      KB_PG_GRAPH_CONTRACT: "1"
      KB_PG_GRAPH_URL: postgres://postgres:pw@localhost:5432/kb_graph
      KB_PG_SCOPE_LIMIT_CONTRACT: "1"
      KB_PG_SCOPE_LIMIT_URL: postgres://postgres:pw@localhost:5432/kb_scope_limit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # graph_contract never calls migrate::apply, so it cannot migrate its own
      # database. Apply the same prisma/migrations SQL to its database here.
      - name: Create contract databases and migrate the graph database
        run: |
          for db in kb_versions kb_outbox kb_acl kb_graph kb_scope_limit; do
            psql "postgres://postgres:pw@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
          for f in prisma/migrations/*/migration.sql; do
            psql "postgres://postgres:pw@localhost:5432/kb_graph" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Clippy (integration)
        run: cargo clippy --manifest-path rust/Cargo.toml -p kb-store-pg --features integration --all-targets -- -D warnings
      - name: Postgres contract tests
        run: cargo test --manifest-path rust/Cargo.toml -p kb-store-pg --features integration -- --test-threads=1

  rust-docker:
    name: Rust Docker build (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native per-architecture builds, the same way the release does it.
          # Building arm64 under QEMU on an x86 runner took 4-6 hours here.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/${{ matrix.arch }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          # Same scope as the release image job, so a release starts warm.
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

  rust-smoke:
    name: Rust live end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run smoke test script
        run: ./rust/scripts/smoke.sh

  rust-eval-gate:
    name: Rust retrieval eval & scope isolation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # With stub embeddings these numbers are deterministic plumbing numbers.
      - name: Fetch libpdfium
        run: |
          ./rust/scripts/fetch-pdfium.sh ./rust/.vendor/pdfium
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/rust/.vendor/pdfium/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Run CI eval gate
        run: ./rust/scripts/ci-eval-gate.sh
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            eval-out/tiny/report.md
            eval-out/tiny/metrics.json
            eval-out/leak/leak-report.md
