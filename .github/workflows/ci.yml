name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust formatting, clippy, and boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --manifest-path rust/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: KB boundary check
        run: cargo run --manifest-path rust/Cargo.toml -p kb-server -- check-boundary
      # The engine must never construct an adapter directly. This is the
      # invariant that keeps the KB embeddable as well as standalone — if it
      # breaks, the next extraction becomes a rewrite.
      - name: Scope token isolation check
        run: |
          if git grep -n "new_for_adapter" rust/crates/ \
            ':!rust/crates/kb-ports' \
            ':!rust/crates/kb-store-pg' \
            ':!rust/crates/kb-engine/src/fakes.rs'; then
            echo "ERROR: new_for_adapter called outside adapter/fakes!"
            exit 1
          fi

  rust-test:
    name: Rust test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch libpdfium
        run: |
          ./rust/scripts/fetch-pdfium.sh ./rust/.vendor/pdfium
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/rust/.vendor/pdfium/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Run workspace tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

  rust-docker:
    name: Rust Docker build (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rust-smoke:
    name: Rust live end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run smoke test script
        run: ./rust/scripts/smoke.sh

  rust-eval-gate:
    name: Rust retrieval eval & scope isolation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # With stub embeddings these numbers are deterministic plumbing numbers.
      - name: Fetch libpdfium
        run: |
          ./rust/scripts/fetch-pdfium.sh ./rust/.vendor/pdfium
          echo "PDFIUM_DYNAMIC_LIB_PATH=$GITHUB_WORKSPACE/rust/.vendor/pdfium/lib/libpdfium.so" >> $GITHUB_ENV
      - name: Run CI eval gate
        run: ./rust/scripts/ci-eval-gate.sh
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            eval-out/tiny/report.md
            eval-out/tiny/metrics.json
            eval-out/leak/leak-report.md
